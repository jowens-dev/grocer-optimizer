<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <linearGradient id="logo-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1F2937" />
            <stop offset="100%" stop-color="#111827" />
        </linearGradient>
        <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Dark rounded background matching the glassmorphic card -->
    <rect width="512" height="512" rx="110" fill="url(#logo-bg-grad)" stroke="#374151" stroke-width="8" />

    <!-- Neon outline glow -->
    <g filter="url(#neon-glow)">
        <!-- Shopping Cart Basket + Chassis Path -->
        <path d="M 120,160 L 150,320 L 350,320 L 390,200 L 180,200" fill="none" stroke="#10B981" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Shopping Cart Handle -->
        <path d="M 120,160 L 90,140" fill="none" stroke="#10B981" stroke-width="24" stroke-linecap="round" />
        
        <!-- Big Number 1 merged inside the cart -->
        <path d="M 220,160 L 260,130 L 260,290" fill="none" stroke="#10B981" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Cart Wheels -->
        <circle cx="180" cy="385" r="28" fill="#10B981" />
        <circle cx="320" cy="385" r="28" fill="#10B981" />
    </g>
</svg>
